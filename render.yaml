services:
  - type: web_service
    name: tripod-roadmap-api
    env: node
    region: oregon
    branch: main
    buildCommand: cd server && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://your-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
  - type: static_site
    name: tripod-roadmap-web
    env: static
    region: oregon
    branch: main
    buildCommand: cd client && npm install && npm run build
    publishPath: client/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://your-backend.onrender.com
