<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgressAI | Dynamic Task Tracker</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">
                <span class="logo-icon">🚀</span>
                <h1>ProgressAI</h1>
            </div>
            <div class="user-profile">
                <span id="username-display">Guest</span>
                <div class="avatar"></div>
            </div>
        </header>

        <main>
            <section class="dashboard">
                <div class="stats-container">
                    <div class="stat-card" id="productivity-card">
                        <h3>Productivity Score</h3>
                        <div class="score-ring">
                            <svg viewBox="0 0 36 36" class="circular-chart">
                                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path class="circle" id="score-circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <text x="18" y="20.35" class="percentage" id="score-text">0%</text>
                            </svg>
                        </div>
                    </div>
                    <div class="stat-card">
                        <h3>Tasks Completed</h3>
                        <p class="stat-value" id="completed-tasks">0/0</p>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="overall-progress-bar"></div>
                        </div>
                    </div>
                    <div class="stat-card ai-suggestion" id="suggestion-card">
                        <h3>AI Suggestion</h3>
                        <p id="suggestion-text">Add your first task to get started!</p>
                        <button class="btn-secondary" id="suggest-btn">Refresh Suggestion</button>
                    </div>
                </div>

                <div class="task-section">
                    <div class="task-header">
                        <h2>Your Tasks</h2>
                        <button class="btn-primary" id="add-task-btn">+ New Task</button>
                    </div>
                    <div class="task-list" id="task-list">
                        <!-- Tasks will be injected here -->
                    </div>
                </div>
            </section>
        </main>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modal-title">New Task</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="taskName">Task Name</label>
                        <input type="text" id="taskName" required placeholder="What needs to be done?">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="priority">Priority (1-5)</label>
                            <input type="number" id="priority" min="1" max="5" value="3">
                        </div>
                        <div class="form-group">
                            <label for="hours">Est. Hours</label>
                            <input type="number" id="hours" min="1" value="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="deadline">Deadline</label>
                        <input type="date" id="deadline" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Save Task</button>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
